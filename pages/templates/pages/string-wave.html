<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Theory Wave</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
</style>
</head>
<body>
<canvas id="string-canvas"></canvas>

<script type="module">
  import * as THREE from 'https://esm.sh/three@0.180.0';

  const canvas = document.getElementById('string-canvas');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 5);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight, false);

  const strings = [];
  const stringCount = 12;
  const segments = 64;

  for (let i = 0; i < stringCount; i++) {
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array((segments + 1) * 3);
    const y = (i - stringCount / 2) * 0.25;

    for (let j = 0; j <= segments; j++) {
      const x = (j / segments - 0.5) * 8;
      positions[j * 3] = x;
      positions[j * 3 + 1] = y;
      positions[j * 3 + 2] = 0;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const material = new THREE.LineBasicMaterial({
      color: new THREE.Color('#83c3ff'),
      transparent: true,
      opacity: 0.5,
    });

    const line = new THREE.Line(geometry, material);
    line.userData = {
      baseY: y,
      frequency: 0.5 + Math.random() * 1.5,
      amplitude: 0.1 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
    };
    strings.push(line);
    scene.add(line);
  }

  let scrollProgress = 0;
  let time = 0;

  function animate() {
    time += 0.016;

    strings.forEach((line) => {
      const positions = line.geometry.attributes.position.array;
      const { baseY, frequency, amplitude, phase } = line.userData;

      for (let j = 0; j <= segments; j++) {
        const x = positions[j * 3];
        const vibration = Math.sin(x * frequency + time * 2 + phase) * amplitude;
        const scrollEffect = Math.sin(x * 0.5 + time) * scrollProgress * 0.5;
        positions[j * 3 + 1] = baseY + vibration + scrollEffect;
      }

      line.geometry.attributes.position.needsUpdate = true;
    });

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  window.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'scroll') {
      scrollProgress = e.data.progress;
    }
  });

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  animate();
</script>
</body>
</html>
