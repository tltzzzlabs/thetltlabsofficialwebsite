[project]
name = "tltzwebsite"
version = "0.1.0"
description = "Main website for the tlt labs"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "osmnx>=2.0",
    "scipy>=1.14",
    "alphashape>=1.3",
    "shapely>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "gunicorn>=22.0",
    "scipy-stubs~=1.18.1",
    "redis==5.0.3",
    "scikit-learn>=1.9.1",
    "whitenoise>=6.5",
    "psycopg[binary]>=3.1",
    "pillow>=13.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["pages"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.coverage.run]
source = ["pages"]
omit = [
    "pages/tests/*",
    "pages/services/tests/*",
    "*/migrations/*",
    "*/management/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
sort = "-cover"

[tool.coverage.html]
directory = "report"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
